<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    #pill {
      position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.86);
      min-width: 520px; padding: 28px 36px; border-radius: 28px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(18px); opacity: 0;
      font: 700 42px "Space Grotesk", system-ui; color: #fff; text-align: center;
    }
    #hint { position: absolute; left: 50%; top: 52%; transform: translateX(-50%); font: 600 24px "Space Grotesk", system-ui; color: #94A3B8; opacity: 0; }
  </style>
</head>
<body>
  <div id="pill"></div>
  <div id="hint"></div>
  <script>
    (function () {
      var B = window.__BLOCK || {};
      document.getElementById('pill').textContent = B.label || 'Render complete';
      document.getElementById('hint').textContent = B.hint || 'Tap to download';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.to('#pill', { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, 0);
      tl.to('#hint', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.35);
      tl.to('#pill', { y: -12, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.8);
      window.__timelines['custom-html'] = tl;
      if (typeof window.__HF_DURATION === 'undefined') tl.play();
    })();
  </script>
</body>
</html>
